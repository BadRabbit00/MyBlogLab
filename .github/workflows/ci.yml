name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-container:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Tests
        run: nix develop . --command python -m pytest -q
      - name: Build container
        run: nix build .#container --out-link result-container -L
      - name: Load and smoke-test container
        run: |
          docker load --input result-container
          bash scripts/smoke-container.sh
      - name: Prepare downloadable image
        run: |
          mkdir -p dist
          cp --dereference result-container dist/blog-agent-linux-amd64.tar.gz
          cd dist
          sha256sum blog-agent-linux-amd64.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: blog-agent-linux-amd64-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
